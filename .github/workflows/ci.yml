name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint, test and build each package
        run: |
          found=0
          for dir in . client server; do
            if [ -f "$dir/package.json" ]; then
              found=1
              echo "== $dir =="
              (cd "$dir" && npm ci && npm run lint --if-present && npm test --if-present && npm run build --if-present)
            fi
          done
          if [ "$found" = 0 ]; then echo "No package.json yet, nothing to check."; fi
